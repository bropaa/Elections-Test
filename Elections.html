<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>School Prefect Election</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 10px;
        }
        
        .container {
            max-width: 480px;
            margin: 0 auto;
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.15);
            overflow: hidden;
            animation: slideIn 0.5s ease-out;
        }
        
        @keyframes slideIn {
            from { transform: translateY(30px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }
        
        .header {
            background: linear-gradient(135deg, #2c3e50, #3498db);
            color: white;
            padding: 30px 20px;
            text-align: center;
            position: relative;
            overflow: hidden;
        }
        
        .header::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle, rgba(255,255,255,0.1) 0%, transparent 70%);
            animation: shimmer 3s ease-in-out infinite;
        }
        
        @keyframes shimmer {
            0%, 100% { transform: rotate(0deg); }
            50% { transform: rotate(180deg); }
        }
        
        .header h1 {
            font-size: 1.8em;
            margin-bottom: 5px;
            position: relative;
            z-index: 1;
        }
        
        .header p {
            font-size: 0.9em;
            opacity: 0.9;
            position: relative;
            z-index: 1;
        }
        
        .admin-toggle {
            position: absolute;
            top: 15px;
            right: 15px;
            background: rgba(255,255,255,0.2);
            border: none;
            color: white;
            padding: 8px 12px;
            border-radius: 20px;
            font-size: 12px;
            cursor: pointer;
            transition: all 0.3s ease;
            z-index: 2;
        }
        
        .admin-toggle:hover {
            background: rgba(255,255,255,0.3);
            transform: scale(1.05);
        }
        
        .section {
            padding: 25px;
        }
        
        .admin-section {
            display: none;
            border-bottom: 2px solid #f0f0f0;
            background: #f8f9fa;
        }
        
        .admin-section.show {
            display: block;
        }
        
        .form-group {
            margin-bottom: 20px;
        }
        
        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: #333;
            font-size: 14px;
        }
        
        input, select, textarea {
            width: 100%;
            padding: 15px;
            border: 2px solid #e1e8ed;
            border-radius: 12px;
            font-size: 16px;
            transition: all 0.3s ease;
            background: white;
        }
        
        input:focus, select:focus {
            outline: none;
            border-color: #3498db;
            box-shadow: 0 0 0 3px rgba(52, 152, 219, 0.1);
            transform: translateY(-1px);
        }
        
        .btn {
            width: 100%;
            padding: 15px;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-bottom: 10px;
            position: relative;
            overflow: hidden;
        }
        
        .btn::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            width: 0;
            height: 0;
            background: rgba(255,255,255,0.2);
            border-radius: 50%;
            transition: all 0.5s ease;
            transform: translate(-50%, -50%);
        }
        
        .btn:active::before {
            width: 300px;
            height: 300px;
        }
        
        .btn-primary {
            background: linear-gradient(135deg, #3498db, #2980b9);
            color: white;
        }
        
        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(52, 152, 219, 0.3);
        }
        
        .btn-success {
            background: linear-gradient(135deg, #27ae60, #229954);
            color: white;
        }
        
        .btn-success:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(39, 174, 96, 0.3);
        }
        
        .btn-danger {
            background: linear-gradient(135deg, #e74c3c, #c0392b);
            color: white;
        }
        
        .btn-small {
            width: auto;
            padding: 8px 16px;
            font-size: 14px;
            display: inline-block;
            margin-right: 10px;
        }
        
        .candidate-item {
            background: white;
            padding: 15px;
            margin: 10px 0;
            border-radius: 12px;
            border: 2px solid #e1e8ed;
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: all 0.3s ease;
        }
        
        .candidate-item:hover {
            border-color: #3498db;
            transform: translateX(5px);
        }
        
        .voting-section {
            text-align: center;
        }
        
        .vote-card {
            background: #f8f9fa;
            border-radius: 15px;
            padding: 20px;
            margin: 15px 0;
            border: 2px solid transparent;
            transition: all 0.3s ease;
            cursor: pointer;
        }
        
        .vote-card:hover {
            border-color: #3498db;
            transform: translateY(-3px);
            box-shadow: 0 10px 30px rgba(52, 152, 219, 0.1);
        }
        
        .vote-card.selected {
            border-color: #27ae60;
            background: #e8f5e8;
        }
        
        .candidate-name {
            font-size: 18px;
            font-weight: 600;
            color: #2c3e50;
            margin-bottom: 5px;
        }
        
        .candidate-info {
            font-size: 14px;
            color: #666;
        }
        
        .alert {
            padding: 15px;
            border-radius: 12px;
            margin: 15px 0;
            font-weight: 500;
            text-align: center;
            animation: fadeIn 0.5s ease;
        }
        
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        .alert-success {
            background: #d4edda;
            color: #155724;
            border: 2px solid #c3e6cb;
        }
        
        .alert-danger {
            background: #f8d7da;
            color: #721c24;
            border: 2px solid #f5c6cb;
        }
        
        .alert-info {
            background: #d1ecf1;
            color: #0c5460;
            border: 2px solid #bee5eb;
        }
        
        .results-section {
            background: #f8f9fa;
        }
        
        .results-grid {
            margin-top: 20px;
        }
        
        .result-card {
            background: white;
            padding: 20px;
            margin: 10px 0;
            border-radius: 15px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
            border-left: 5px solid #3498db;
            transition: transform 0.3s ease;
        }
        
        .result-card:hover {
            transform: translateX(5px);
        }
        
        .result-card.winner {
            border-left-color: #f1c40f;
            background: linear-gradient(135deg, #fff9e6, #ffffff);
        }
        
        .result-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }
        
        .candidate-result-name {
            font-size: 18px;
            font-weight: 600;
            color: #2c3e50;
        }
        
        .vote-count {
            font-size: 24px;
            font-weight: bold;
            color: #3498db;
        }
        
        .progress-bar {
            width: 100%;
            height: 8px;
            background: #ecf0f1;
            border-radius: 10px;
            overflow: hidden;
            margin-top: 10px;
        }
        
        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #3498db, #2980b9);
            border-radius: 10px;
            transition: width 0.8s ease;
            position: relative;
        }
        
        .progress-fill::after {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.3), transparent);
            animation: shimmerProgress 2s infinite;
        }
        
        @keyframes shimmerProgress {
            0% { transform: translateX(-100%); }
            100% { transform: translateX(100%); }
        }
        
        .stats-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin: 20px 0;
        }
        
        .stat-card {
            background: white;
            padding: 15px;
            border-radius: 12px;
            text-align: center;
            box-shadow: 0 3px 10px rgba(0,0,0,0.1);
        }
        
        .stat-number {
            font-size: 24px;
            font-weight: bold;
            color: #3498db;
        }
        
        .stat-label {
            font-size: 12px;
            color: #666;
            margin-top: 5px;
        }
        
        .code-display {
            background: #e8f5e8;
            border: 2px solid #27ae60;
            border-radius: 12px;
            padding: 20px;
            margin: 20px 0;
            text-align: center;
        }
        
        .codes-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(80px, 1fr));
            gap: 10px;
            margin-top: 15px;
            max-height: 200px;
            overflow-y: auto;
        }
        
        .code-item {
            background: white;
            padding: 10px 5px;
            border-radius: 8px;
            font-family: 'Courier New', monospace;
            font-weight: bold;
            font-size: 12px;
            border: 1px solid #ddd;
            transition: all 0.3s ease;
        }
        
        .code-item.used {
            opacity: 0.5;
            text-decoration: line-through;
            background: #f8f8f8;
        }
        
        .emoji {
            font-size: 24px;
            margin-bottom: 10px;
        }
        
        .loading {
            display: none;
            text-align: center;
            padding: 20px;
        }
        
        .spinner {
            width: 40px;
            height: 40px;
            border: 4px solid #f3f3f3;
            border-top: 4px solid #3498db;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 10px;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        /* Mobile optimizations */
        @media (max-width: 480px) {
            .container {
                margin: 5px;
                border-radius: 15px;
            }
            
            .header {
                padding: 20px 15px;
            }
            
            .section {
                padding: 20px 15px;
            }
            
            .btn {
                padding: 18px;
                font-size: 18px;
            }
            
            input, select {
                padding: 18px;
                font-size: 18px;
            }
        }
        
        .hidden {
            display: none !important;
        }
        
        .fade-in {
            animation: fadeInUp 0.6s ease;
        }
        
        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <button class="admin-toggle" onclick="toggleAdmin()">⚙️ Admin</button>
            <div class="emoji">🗳️</div>
            <h1 id="electionTitle">School Prefect Election</h1>
            <p>Cast your vote securely</p>
        </div>
        
        <!-- Admin Section -->
        <div id="adminSection" class="admin-section">
            <div class="section">
                <h3 style="margin-bottom: 20px; color: #2c3e50;">📋 Election Setup</h3>
                
                <div class="form-group">
                    <label for="titleInput">Election Title:</label>
                    <input type="text" id="titleInput" value="School Prefect Election 2025" onchange="updateTitle()">
                </div>
                
                <div class="form-group">
                    <label for="candidateInput">Add Candidate:</label>
                    <input type="text" id="candidateInput" placeholder="Enter candidate name">
                    <button class="btn btn-primary" onclick="addCandidate()">Add Candidate</button>
                </div>
                
                <div id="candidatesList">
                    <h4 style="margin: 20px 0 10px 0;">Current Candidates:</h4>
                    <div id="candidatesContainer"></div>
                </div>
                
                <div class="form-group" style="margin-top: 30px;">
                    <label for="numVoters">Number of Eligible Voters:</label>
                    <input type="number" id="numVoters" value="50" min="1" max="1000">
                    <button class="btn btn-success" onclick="generateCodes()">Generate Voting Codes</button>
                </div>
                
                <div id="codesDisplay"></div>
                
                <div style="margin-top: 20px;">
                    <button class="btn btn-danger" onclick="resetElection()">Reset Election</button>
                </div>
            </div>
        </div>
        
        <!-- Voting Section -->
        <div id="votingSection" class="section voting-section fade-in">
            <div class="emoji">✨</div>
            <h2 style="margin-bottom: 20px; color: #2c3e50;">Cast Your Vote</h2>
            
            <div class="form-group">
                <label for="voterCode">Enter Your Voting Code:</label>
                <input type="text" id="voterCode" placeholder="Enter your unique code" 
                       style="text-align: center; text-transform: uppercase; letter-spacing: 2px;" 
                       maxlength="8" onchange="validateCode()">
            </div>
            
            <div id="candidatesVoting" class="hidden">
                <h3 style="margin: 20px 0; color: #2c3e50;">Select Your Candidate:</h3>
                <div id="votingCandidates"></div>
                <button class="btn btn-success" onclick="submitVote()" id="voteButton" disabled>
                    🗳️ Cast My Vote
                </button>
            </div>
            
            <div id="voteMessage"></div>
        </div>
        
        <!-- Results Section -->
        <div id="resultsSection" class="section results-section">
            <h2 style="margin-bottom: 20px; color: #2c3e50; text-align: center;">📊 Live Results</h2>
            
            <div class="stats-row">
                <div class="stat-card">
                    <div class="stat-number" id="totalVotesCount">0</div>
                    <div class="stat-label">Total Votes</div>
                </div>
                <div class="stat-card">
                    <div class="stat-number" id="turnoutPercent">0%</div>
                    <div class="stat-label">Turnout</div>
                </div>
            </div>
            
            <div id="resultsContainer"></div>
            
            <div style="text-align: center; margin-top: 20px;">
                <button class="btn btn-primary" onclick="refreshResults()">🔄 Refresh Results</button>
            </div>
        </div>
    </div>
    
    <div id="loading" class="loading">
        <div class="spinner"></div>
        <p>Processing your vote...</p>
    </div>

    <script>
        // Global state management
        let electionState = {
            title: "School Prefect Election 2025",
            candidates: [],
            votingCodes: new Set(),
            usedCodes: new Set(),
            votes: {},
            isAdminMode: false,
            selectedCandidate: null
        };

        // Initialize the application
        function initApp() {
            loadState();
            updateUI();
            setInterval(updateResults, 5000); // Auto-refresh results every 5 seconds
        }

        // Load state from localStorage
        function loadState() {
            try {
                const saved = localStorage.getItem('electionState');
                if (saved) {
                    const parsed = JSON.parse(saved);
                    electionState = {
                        ...electionState,
                        ...parsed,
                        votingCodes: new Set(parsed.votingCodes || []),
                        usedCodes: new Set(parsed.usedCodes || [])
                    };
                }
            } catch (error) {
                console.warn('Could not load saved state:', error);
            }
        }

        // Save state to localStorage
        function saveState() {
            try {
                const stateToSave = {
                    ...electionState,
                    votingCodes: Array.from(electionState.votingCodes),
                    usedCodes: Array.from(electionState.usedCodes)
                };
                localStorage.setItem('electionState', JSON.stringify(stateToSave));
            } catch (error) {
                console.warn('Could not save state:', error);
            }
        }

        // Update all UI elements
        function updateUI() {
            document.getElementById('electionTitle').textContent = electionState.title;
            document.getElementById('titleInput').value = electionState.title;
            updateCandidatesList();
            updateVotingCandidates();
            updateResults();
            displayCodes();
        }

        // Toggle admin mode
        function toggleAdmin() {
            electionState.isAdminMode = !electionState.isAdminMode;
            const adminSection = document.getElementById('adminSection');
            
            if (electionState.isAdminMode) {
                adminSection.classList.add('show');
            } else {
                adminSection.classList.remove('show');
            }
        }

        // Update election title
        function updateTitle() {
            electionState.title = document.getElementById('titleInput').value;
            document.getElementById('electionTitle').textContent = electionState.title;
            saveState();
        }

        // Add candidate
        function addCandidate() {
            const input = document.getElementById('candidateInput');
            const name = input.value.trim();
            
            if (name && !electionState.candidates.includes(name)) {
                electionState.candidates.push(name);
                electionState.votes[name] = 0;
                input.value = '';
                updateCandidatesList();
                updateVotingCandidates();
                saveState();
                showAlert('Candidate added successfully!', 'success');
            } else if (electionState.candidates.includes(name)) {
                showAlert('Candidate already exists!', 'danger');
            } else {
                showAlert('Please enter a candidate name!', 'danger');
            }
        }

        // Remove candidate
        function removeCandidate(name) {
            if (confirm(`Remove ${name} from the election?`)) {
                electionState.candidates = electionState.candidates.filter(c => c !== name);
                delete electionState.votes[name];
                updateCandidatesList();
                updateVotingCandidates();
                saveState();
                showAlert('Candidate removed!', 'info');
            }
        }

        // Update candidates list in admin
        function updateCandidatesList() {
            const container = document.getElementById('candidatesContainer');
            container.innerHTML = '';
            
            electionState.candidates.forEach(candidate => {
                const div = document.createElement('div');
                div.className = 'candidate-item';
                div.innerHTML = `
                    <span><strong>${candidate}</strong></span>
                    <button class="btn btn-danger btn-small" onclick="removeCandidate('${candidate}')">Remove</button>
                `;
                container.appendChild(div);
            });
        }

        // Update voting candidates display
        function updateVotingCandidates() {
            const container = document.getElementById('votingCandidates');
            container.innerHTML = '';
            
            electionState.candidates.forEach(candidate => {
                const div = document.createElement('div');
                div.className = 'vote-card';
                div.onclick = () => selectCandidate(candidate, div);
                div.innerHTML = `
                    <div class="candidate-name">${candidate}</div>
                    <div class="candidate-info">Tap to select</div>
                `;
                container.appendChild(div);
            });
        }

        // Select candidate for voting
        function selectCandidate(candidate, element) {
            // Remove previous selection
            document.querySelectorAll('.vote-card').forEach(card => {
                card.classList.remove('selected');
            });
            
            // Add selection to clicked card
            element.classList.add('selected');
            electionState.selectedCandidate = candidate;
            
            // Enable vote button
            document.getElementById('voteButton').disabled = false;
        }

        // Generate voting codes
        function generateCodes() {
            const numVoters = parseInt(document.getElementById('numVoters').value);
            
            if (numVoters < 1 || numVoters > 1000) {
                showAlert('Please enter a number between 1 and 1000', 'danger');
                return;
            }
            
            electionState.votingCodes.clear();
            
            // Generate unique codes
            while (electionState.votingCodes.size < numVoters) {
                const code = generateRandomCode();
                electionState.votingCodes.add(code);
            }
            
            displayCodes();
            saveState();
            showAlert(`${numVoters} voting codes generated!`, 'success');
        }

        // Generate random voting code
        function generateRandomCode() {
            const chars = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789';
            let code = '';
            for (let i = 0; i < 6; i++) {
                code += chars.charAt(Math.floor(Math.random() * chars.length));
            }
            return code;
        }

        // Display generated codes
        function displayCodes() {
            const container = document.getElementById('codesDisplay');
            
            if (electionState.votingCodes.size === 0) {
                container.innerHTML = '';
                return;
            }
            
            const codesArray = Array.from(electionState.votingCodes);
            
            let html = '<div class="code-display">';
            html += '<h4>🎫 Generated Voting Codes</h4>';
            html += `<p>Share these codes with eligible voters. Total: ${codesArray.length}</p>`;
            html += '<div class="codes-grid">';
            
            codesArray.forEach(code => {
                const isUsed = electionState.usedCodes.has(code);
                html += `<div class="code-item ${isUsed ? 'used' : ''}">${code}</div>`;
            });
            
            html += '</div>';
            html += `<button class="btn btn-primary" onclick="downloadCodes()" style="margin-top: 15px;">📥 Download Codes</button>`;
            html += '</div>';
            
            container.innerHTML = html;
        }

        // Download codes as text file
        function downloadCodes() {
            const codesArray = Array.from(electionState.votingCodes);
            const text = codesArray.join('\n');
            const blob = new Blob([text], { type: 'text/plain' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `voting_codes_${new Date().toISOString().slice(0,10)}.txt`;
            a.click();
            URL.revokeObjectURL(url);
        }

        // Validate voting code
        function validateCode() {
            const code = document.getElementById('voterCode').value.toUpperCase();
            const candidatesSection = document.getElementById('candidatesVoting');
            
            if (code.length >= 6) {
                if (electionState.votingCodes.has(code)) {
                    if (electionState.usedCodes.has(code)) {
                        showAlert('This code has already been used!', 'danger');
                        candidatesSection.classList.add('hidden');
                    } else {
                        showAlert('Valid code! Please select your candidate.', 'success');
                        candidatesSection.classList.remove('hidden');
                    }
                } else {
                    showAlert('Invalid voting code. Please check and try again.', 'danger');
                    candidatesSection.classList.add('hidden');
                }
            } else {
                candidatesSection.classList.add('hidden');
                document.getElementById('voteMessage').innerHTML = '';
            }
        }

        // Submit vote
        function submitVote() {
            const code = document.getElementById('voterCode').value.toUpperCase();
            const candidate = electionState.selectedCandidate;
            
            if (!code || !candidate) {
                showAlert('Please enter your code and select a candidate!', 'danger');
                return;
            }
            
            if (!electionState.votingCodes.has(code)) {
                showAlert('Invalid voting code!', 'danger');
                return;
            }
            
            if (electionState.usedCodes.has(code)) {
                showAlert('This code has already been used!', 'danger');
                return;
            }
            
            // Show loading
            document.getElementById('loading').style.display = 'block';
            
            // Simulate processing time
            setTimeout(() => {
                // Record the vote
                electionState.votes[candidate]++;
                electionState.usedCodes.add(code);
                
                // Clear form
                document.getElementById('voterCode').value = '';
                document.getElementById('candidatesVoting').classList.add('hidden');
                electionState.selectedCandidate = null;
                
                // Update displays
                saveState();
                updateResults();
                displayCodes();
                
                // Hide loading
                document.getElementById('loading').style.display = 'none';
                
                // Show success message
                showAlert(`🎉 Thank you! Your vote for ${candidate} has been recorded.`, 'success');
                
            }, 1500);
        }

        // Update results display
        function updateResults() {
            const totalVotes = Object.values(electionState.votes).reduce((sum, count) => sum + count, 0);
            const totalCodes = electionState.votingCodes.size;
            const turnoutRate = totalCodes > 0 ? Math.round((totalVotes / totalCodes) * 100) : 0;
            
            // Update stats
            document.getElementById('totalVotesCount').textContent = totalVotes;
            document.getElementById('turnoutPercent').textContent = turnoutRate + '%';
            
            // Update results
            const container = document.getElementById('resultsContainer');
            
            if (electionState.candidates.length === 0) {
                container.innerHTML = '<div class="alert alert-info">No candidates added yet.</div>';
                return;
            }
            
            if (totalVotes === 0) {
                container.innerHTML = '<div class="alert alert-info">No votes cast yet. Results will appear here as votes come in.</div>';
                return;
            }
            
            // Sort candidates by vote count
            const sortedCandidates = electionState.candidates
                .map(name => ({
                    name,
                    votes: electionState.votes[name] || 0
                }))
                .sort((a, b) => b.votes - a.votes);
            
            let html = '<div class="results-grid">';
            
            sortedCandidates.forEach((candidate, index) => {
                const percentage = totalVotes > 0 ? Math.round((candidate.votes / totalVotes) * 100) : 0;
                const isWinner = index === 0 && candidate.votes > 0;
                const position = index + 1;
                const medal = position === 1 ? '🥇' : position === 2 ? '🥈' : position === 3 ? '🥉' : '';
                
                html += `
                    <div class="result-card ${isWinner ? 'winner' : ''}">
                        <div class="result-header">
                            <div class="candidate-result-name">${medal} ${candidate.name}</div>
                            <div class="vote-count">${candidate.votes}</div>
                        </div>
                        <div style="font-size: 14px; color: #666; margin-bottom: 8px;">
                            ${percentage}% of votes
                        </div>
                        <div class="progress-bar">
                            <div class="progress-fill" style="width: ${percentage}%"></div>
                        </div>
                    </div>
                `;
            });
            
            html += '</div>';
            container.innerHTML = html;
        }

        // Refresh results manually
        function refreshResults() {
            const button = event.target;
            button.disabled = true;
            button.innerHTML = '🔄 Refreshing...';
            
            setTimeout(() => {
                updateResults();
                button.disabled = false;
                button.innerHTML = '🔄 Refresh Results';
                showAlert('Results updated!', 'info');
            }, 1000);
        }

        // Show alert messages
        function showAlert(message, type) {
            const messageDiv = document.getElementById('voteMessage');
            messageDiv.innerHTML = `<div class="alert alert-${type}">${message}</div>`;
            
            // Auto-hide success messages after 5 seconds
            if (type === 'success') {
                setTimeout(() => {
                    messageDiv.innerHTML = '';
                }, 5000);
            }
        }

        // Reset entire election
        function resetElection() {
            if (confirm('⚠️ This will delete ALL election data including candidates, codes, and votes. Are you sure?')) {
                electionState = {
                    title: "School Prefect Election 2025",
                    candidates: [],
                    votingCodes: new Set(),
                    usedCodes: new Set(),
                    votes: {},
                    isAdminMode: false,
                    selectedCandidate: null
                };
                
                localStorage.removeItem('electionState');
                updateUI();
                showAlert('Election has been reset!', 'info');
            }
        }

        // Handle enter key in input fields
        document.addEventListener('DOMContentLoaded', function() {
            // Add candidate with Enter key
            document.getElementById('candidateInput').addEventListener('keypress', function(e) {
                if (e.key === 'Enter') {
                    addCandidate();
                }
            });
            
            // Validate code as user types
            document.getElementById('voterCode').addEventListener('input', function(e) {
                this.value = this.value.toUpperCase();
                if (this.value.length >= 6) {
                    validateCode();
                }
            });
            
            // Initialize the app
            initApp();
        });

        // Export results function
        function exportResults() {
            const totalVotes = Object.values(electionState.votes).reduce((sum, count) => sum + count, 0);
            const sortedCandidates = electionState.candidates
                .map(name => ({
                    name,
                    votes: electionState.votes[name] || 0
                }))
                .sort((a, b) => b.votes - a.votes);
            
            let report = `${electionState.title}\n`;
            report += `Election Results Report\n`;
            report += `Generated: ${new Date().toLocaleString()}\n\n`;
            report += `SUMMARY:\n`;
            report += `Total Votes Cast: ${totalVotes}\n`;
            report += `Total Codes Generated: ${electionState.votingCodes.size}\n`;
            report += `Codes Used: ${electionState.usedCodes.size}\n`;
            report += `Turnout Rate: ${electionState.votingCodes.size > 0 ? Math.round((electionState.usedCodes.size / electionState.votingCodes.size) * 100) : 0}%\n\n`;
            report += `RESULTS:\n`;
            
            sortedCandidates.forEach((candidate, index) => {
                const percentage = totalVotes > 0 ? Math.round((candidate.votes / totalVotes) * 100) : 0;
                const position = index + 1;
                report += `${position}. ${candidate.name}: ${candidate.votes} votes (${percentage}%)\n`;
            });
            
            report += `\nUNUSED CODES: ${electionState.votingCodes.size - electionState.usedCodes.size}\n`;
            
            const blob = new Blob([report], { type: 'text/plain' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `election_results_${new Date().toISOString().slice(0,10)}.txt`;
            a.click();
            URL.revokeObjectURL(url);
        }

        // Add export button to results section if admin is active
        function addExportButton() {
            if (electionState.isAdminMode) {
                const resultsSection = document.getElementById('resultsSection');
                const exportBtn = document.createElement('button');
                exportBtn.className = 'btn btn-primary';
                exportBtn.innerHTML = '📊 Export Results';
                exportBtn.onclick = exportResults;
                exportBtn.style.marginTop = '10px';
                
                // Check if button already exists
                if (!resultsSection.querySelector('.export-btn')) {
                    exportBtn.classList.add('export-btn');
                    resultsSection.appendChild(exportBtn);
                }
            }
        }

        // Update the toggle admin function to include export button
        function toggleAdmin() {
            electionState.isAdminMode = !electionState.isAdminMode;
            const adminSection = document.getElementById('adminSection');
            
            if (electionState.isAdminMode) {
                adminSection.classList.add('show');
                addExportButton();
            } else {
                adminSection.classList.remove('show');
                const exportBtn = document.querySelector('.export-btn');
                if (exportBtn) {
                    exportBtn.remove();
                }
            }
        }
    </script>
</body>
</html>
